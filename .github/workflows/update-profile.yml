name: Update GitHub Profile

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch: # Allow manual triggering
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/generated/**' # Prevent infinite loops by ignoring the generated assets

permissions:
  contents: write # Required to push commits to the repository

jobs:
  generate:
    runs-on: ubuntu-latest
    
    # Prevent infinite loop if the push was made by github-actions
    if: github.actor != 'github-actions[bot]'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for committing changes
          
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create .env file
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "GITHUB_USERNAME=${{ secrets.GITHUB_USERNAME }}" >> .env
          
      - name: Generate SVG Profile
        run: python scripts/generate_profile.py
        
      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain assets/generated/
          if [[ -n "$(git status --porcelain assets/generated/)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date +%s)
          sed -i "s/\(dark_v2.svg\?v=\)[0-9]*/\1$TIMESTAMP/g" README.md
          sed -i "s/\(light_v2.svg\?v=\)[0-9]*/\1$TIMESTAMP/g" README.md
          git add assets/generated/ README.md
          git commit -m "chore(profile): update generated profile"
          git push
