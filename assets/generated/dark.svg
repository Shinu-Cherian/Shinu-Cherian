ull Stack Applications</tspan></text>\n        <text x="401.1" y="204" class="text"><tspan fill="#e3b341">. Languages.Programming: </tspan><tspan fill="#484f58">............................... </tspan><tspan fill="#79c0ff">Python, Java, JavaScript, SQL</tspan></text>\n        <text x="401.1" y="224" class="text"><tspan fill="#e3b341">. Languages.Frontend: </tspan><tspan fill="#484f58">................. </tspan><tspan fill="#79c0ff">React, Next.js, TypeScript, Tailwind CSS, GSAP</tspan></text>\n        <text x="401.1" y="244" class="text"><tspan fill="#e3b341">. Languages.Backend: </tspan><tspan fill="#484f58">............................... </tspan><tspan fill="#79c0ff">Django, FastAPI, Flask, REST APIs</tspan></text>\n        <text x="401.1" y="264" class="text"><tspan fill="#e3b341">. AI: </tspan><tspan fill="#484f58">....................... </tspan><tspan fill="#79c0ff">OpenAI API, Groq API, LangChain, RAG, Prompt Engineering</tspan></text>\n        <text x="401.1" y="284" class="text"><tspan fill="#e3b341">. Databases: </tspan><tspan fill="#484f58">............................... </tspan><tspan fill="#79c0ff">PostgreSQL, MySQL, MongoDB, SQLite, Redis</tspan></text>\n        <text x="401.1" y="304" class="text"><tspan fill="#e3b341">. Cloud / DevOps: </tspan><tspan fill="#484f58">......................... </tspan><tspan fill="#79c0ff">Git, GitHub, Docker, Linux, AWS (Learning)</tspan></text>\n        <text x="401.1" y="344" class="text"><tspan fill="#c9d1d9">- Featured Projects </tspan><tspan fill="#484f58">-----------------------------------------------------------------</tspan></text>\n        <text x="401.1" y="364" class="text"><tspan fill="#e3b341">. HireTrack: </tspan><tspan fill="#484f58">................................ </tspan><tspan fill="#79c0ff">AI job tracker, resume analysis, care...</tspan></text>\n        <text x="401.1" y="384" class="text"><tspan fill="#e3b341">. SynapseIQ: </tspan><tspan fill="#484f58">................................ </tspan><