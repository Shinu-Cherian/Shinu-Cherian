><tspan fill="#0969da">Python, Java, JavaScript, SQL</tspan></text>\n        <text x="401.1" y="224" class="text"><tspan fill="#9a6700">. Languages.Frontend: </tspan><tspan fill="#8c959f">................. </tspan><tspan fill="#0969da">React, Next.js, TypeScript, Tailwind CSS, GSAP</tspan></text>\n        <text x="401.1" y="244" class="text"><tspan fill="#9a6700">. Languages.Backend: </tspan><tspan fill="#8c959f">............................... </tspan><tspan fill="#0969da">Django, FastAPI, Flask, REST APIs</tspan></text>\n        <text x="401.1" y="264" class="text"><tspan fill="#9a6700">. AI: </tspan><tspan fill="#8c959f">....................... </tspan><tspan fill="#0969da">OpenAI API, Groq API, LangChain, RAG, Prompt Engineering</tspan></text>\n        <text x="401.1" y="284" class="text"><tspan fill="#9a6700">. Databases: </tspan><tspan fill="#8c959f">............................... </tspan><tspan fill="#0969da">PostgreSQL, MySQL, MongoDB, SQLite, Redis</tspan></text>\n        <text x="401.1" y="304" class="text"><tspan fill="#9a6700">. Cloud / DevOps: </tspan><tspan fill="#8c959f">......................... </tspan><tspan fill="#0969da">Git, GitHub, Docker, Linux, AWS (Learning)</tspan></text>\n        <text x="401.1" y="344" class="text"><tspan fill="#24292f">- Featured Projects </tspan><tspan fill="#8c959f">-----------------------------------------------------------------</tspan></text>\n        <text x="401.1" y="364" class="text"><tspan fill="#9a6700">. HireTrack: </tspan><tspan fill="#8c959f">................................ </tspan><tspan fill="#0969da">AI job tracker, resume analysis, care...</tspan></text>\n        <text x="401.1" y="384" class="text"><tspan fill="#9a6700">. SynapseIQ: </tspan><tspan fill="#8c959f">................................ </tspan><tspan fill="#0969da">AI team knowledge platform with RAG &amp;...</tspan></text>\n        <text x="401.1" y="424" class="text"><tspan fill="#24292f">- Contact &amp; Links </tspan><tspan fill="#8c959f">-------------------------------------------------------------------</tspan></text>\n        <text x="401.1" y="464" class="text"><tspan fill="#24292f">- GitHub Stats </tspan><tspan fill="#8c959f">----------------------------------------------------------------------</tspan></text>\n        <text x="401.1" y="484" class="text"><tspan fill="#9a6700">. API Status: </tspan><tspan fill="#8c959f">....................................... </tspan><tspan fill="#d1242f">Offline (Using Cached/YAML Data)</tspan></text>\n        <text x="401.1" y="504" class="text"><tspan fill="#9a6700">. Contributions: </tspan><tspan fill="#8c959f">..................... </tspan><tspan fill="#0969da">0 </tspan><tspan fill="#8c959f">| </tspan><tspan fill="#9a6700">Stars: </tspan><tspan fill="#8c959f">.................................. </tspan><tspan fill="#0969da">0</tspan></text>\n        <text x="401.1" y="524" class="text"><tspan fill="#9a6700">. Commits: </tspan><tspan fill="#8c959f">........................... </tspan><tspan fill="#0969da">0 </tspan><tspan fill="#8c959f">| </tspan><tspan fill="#9a6700">Followers: </tspan><tspan fill="#8c959f">.............................. </tspan><tspan fill="#0969da">0</tspan></text>\n        <text x="401.1" y="544" class="text"><tspan fill="#9a6700">. Issues: </tspan><tspan fill="#8c959f">............................ </tspan><tspan fill="#0969da">0 </tspan><tspan fill="#8c959f">| </tspan><tspan fill="#9a6700">PRs: </tspan><tspan fill="#8c959f">.................................... </tspan><tspan fill="#0969da">0</tspan></text>\n        <text x="401.1" y="564" class="text"><tspan fill="#9a6700">. Last Updated: </tspan><tspan fill="#8c959f">................................................. </tspan><tspan fill="#57606a">2026-07-11 10:45 UTC</tspan></text>\n    </g>
