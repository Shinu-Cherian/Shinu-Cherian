ysis, care...</tspan></text>\n        <text x="448.40000000000003" y="450" class="text"><tspan fill="#9a6700">. SynapseIQ: </tspan><tspan fill="#8c959f">................................ </tspan><tspan fill="#0969da">AI team knowledge platform with RAG &amp;...</tspan></text>\n        <text x="448.40000000000003" y="498" class="text"><tspan fill="#24292f">- Contact &amp; Links </tspan><tspan fill="#8c959f">-------------------------------------------------------------------</tspan></text>\n        <text x="448.40000000000003" y="522" class="text"><tspan fill="#9a6700">. Email.Personal: </tspan><tspan fill="#8c959f">........................................... </tspan><a href="mailto:shinucherian90@gmail.com" target="_blank"><tspan fill="#0969da">shinucherian90@gmail.com</tspan></a></text>\n        <text x="448.40000000000003" y="546" class="text"><tspan fill="#9a6700">. LinkedIn: </tspan><tspan fill="#8c959f">........................................................... </tspan><a href="https://linkedin.com/in/shinucherian90" target="_blank"><tspan fill="#0969da">shinucherian90</tspan></a></text>\n        <text x="448.40000000000003" y="594" class="text"><tspan fill="#24292f">- GitHub Stats </tspan><tspan fill="#8c959f">----------------------------------------------------------------------</tspan></text>\n        <text x="448.40000000000003" y="618" class="text"><tspan fill="#9a6700">. API Status: </tspan><tspan fill="#8c959f">....................................... </tspan><tspan fill="#d1242f">Offline (Using Cached/YAML Data)</tspan></text>\n        <text x="448.40000000000003" y="642" class="text"><tspan fill="#9a6700">. Contributions: </tspan><tspan fill="#8c959f">..................... </tspan><tspan fill="#0969da">0 </tspan><tspan fill="#8c959f">| </tspan><tspan fill="#9a6700">Stars: </tspan><tspan fill="#8c959f">.................................. </tspan><tspan fill="#0969da">0</tspan></text>\n        <text x="448.40000000000003" y="666" class="text"><tspan fill="#