</text>\n        <text x="543.0" y="220" class="text"><tspan fill="#9a6700">. Focus: </tspan><tspan fill="#8c959f">................................. </tspan><tspan fill="#0969da">Building AI-powered Full Stack Applications</tspan></text>\n        <text x="543.0" y="280" class="text"><tspan fill="#9a6700">. Languages.Programming: </tspan><tspan fill="#8c959f">............................... </tspan><tspan fill="#0969da">Python, Java, JavaScript, SQL</tspan></text>\n        <text x="543.0" y="310" class="text"><tspan fill="#9a6700">. Languages.Frontend: </tspan><tspan fill="#8c959f">................. </tspan><tspan fill="#0969da">React, Next.js, TypeScript, Tailwind CSS, GSAP</tspan></text>\n        <text x="543.0" y="340" class="text"><tspan fill="#9a6700">. Languages.Backend: </tspan><tspan fill="#8c959f">............................... </tspan><tspan fill="#0969da">Django, FastAPI, Flask, REST APIs</tspan></text>\n        <text x="543.0" y="370" class="text"><tspan fill="#9a6700">. AI: </tspan><tspan fill="#8c959f">....................... </tspan><tspan fill="#0969da">OpenAI API, Groq API, LangChain, RAG, Prompt Engineering</tspan></text>\n        <text x="543.0" y="400" class="text"><tspan fill="#9a6700">. Databases: </tspan><tspan fill="#8c959f">............................... </tspan><tspan fill="#0969da">PostgreSQL, MySQL, MongoDB, SQLite, Redis</tspan></text>\n        <text x="543.0" y="430" class="text"><tspan fill="#9a6700">. Cloud / DevOps: </tspan><tspan fill="#8c959f">......................... </tspan><tspan fill="#0969da">Git, GitHub, Docker, Linux, AWS (Learning)</tspan></text>\n        <text x="543.0" y="490" class="text"><tspan fill="#24292f">- Featured Projects </tspan><tspan fill="#8c959f">-----------------------------------------------------------------</tspan></text>\n        <text x="543.0" y="520" class="text"><tspan fill="#9a6700">. hiretrack: </tspan><tspan fill="#8c959f">............................................................. </tspan><tspan fill="#0969da"> JavaScript</tspan></text>\n        <text x="543.0" y="550" class="text"><tspan fill="#9a6700">. SynapseIQ: </tspan><tspan fill="#8c959f">................................................................. </tspan><tspan fill="#0969da"> Python</tspan></text>\n        <text x="543.0" y="610" class="text"><tspan fill="#24292f">- Contact &amp; Links </tspan><tspan fill="#8c959f">-------------------------------------------------------------------</tspan></text>\n        <text x="543.0" y="640" class="text"><tspan fill="#9a6700">. Email.Personal: </tspan><tspan fill="#8c959f">........................................... </tspan><a href="mailto:shinucherian90@gmail.com" target="_blank"><tspan fill="#0969da">shinucherian90@gmail.com</tspan></a></text>\n        <text x="543.0" y="670" class="text"><tspan fill="#9a6700">. LinkedIn: </tspan><tspan fill="#8c959f">........................................................... </tspan><a href="https://linkedin.com/in/shinucherian90" target="_blank"><tspan fill="#0969da">shinucherian90</tspan></a></text>\n        <text x="543.0" y="730" class="text"><tspan fill="#24292f">- GitHub Stats </tspan><tspan fill="#8c959f">----------------------------------------------------------------------</tspan></text>\n        <text x="543.0" y="760" class="text"><tspan fill="#9a6700">. Contributions: </tspan><tspan fill="#8c959f">................... </tspan><tspan fill="#0969da">589 </tspan><tspan fill="#8c959f">| </tspan><tspan fill="#9a6700">Stars: </tspan><tspan fill="#8c959f">.................................. </tspan><tspan fill="#0969da">0</tspan></text>\n        <text x="543.0" y="790" class="text"><tspan fill="#9a6700">. Commits: </tspan><tspan fill="#8c959f">......................... </tspan><tspan fill="#0969da">444 </tspan><tspan fill="#8c959f">| </tspan><tspan fill="#9a6700">Followers: </tspan><tspan fill="#8c959f">.............................. </tspan><tspan fill="#0969da">1</tspan></text>\n        <text x="543.0" y="82