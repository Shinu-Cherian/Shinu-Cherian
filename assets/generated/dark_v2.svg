</text>\n        <text x="543.0" y="220" class="text"><tspan fill="#e3b341">. Focus: </tspan><tspan fill="#484f58">................................. </tspan><tspan fill="#79c0ff">Building AI-powered Full Stack Applications</tspan></text>\n        <text x="543.0" y="280" class="text"><tspan fill="#e3b341">. Languages.Programming: </tspan><tspan fill="#484f58">............................... </tspan><tspan fill="#79c0ff">Python, Java, JavaScript, SQL</tspan></text>\n        <text x="543.0" y="310" class="text"><tspan fill="#e3b341">. Languages.Frontend: </tspan><tspan fill="#484f58">................. </tspan><tspan fill="#79c0ff">React, Next.js, TypeScript, Tailwind CSS, GSAP</tspan></text>\n        <text x="543.0" y="340" class="text"><tspan fill="#e3b341">. Languages.Backend: </tspan><tspan fill="#484f58">............................... </tspan><tspan fill="#79c0ff">Django, FastAPI, Flask, REST APIs</tspan></text>\n        <text x="543.0" y="370" class="text"><tspan fill="#e3b341">. AI: </tspan><tspan fill="#484f58">....................... </tspan><tspan fill="#79c0ff">OpenAI API, Groq API, LangChain, RAG, Prompt Engineering</tspan></text>\n        <text x="543.0" y="400" class="text"><tspan fill="#e3b341">. Databases: </tspan><tspan fill="#484f58">............................... </tspan><tspan fill="#79c0ff">PostgreSQL, MySQL, MongoDB, SQLite, Redis</tspan></text>\n        <text x="543.0" y="430" class="text"><tspan fill="#e3b341">. Cloud / DevOps: </tspan><tspan fill="#484f58">......................... </tspan><tspan fill="#79c0ff">Git, GitHub, Docker, Linux, AWS (Learning)</tspan></text>\n        <text x="543.0" y="490" class="text"><tspan fill="#c9d1d9">- Featured Projects </tspan><tspan fill="#484f58">-----------------------------------------------------------------</tspan></text>\n        <text x="543.0" y="520" class="text"><tspan fill="#e3b341">. hiretrack: </tspan><tspan fill="#484f58">............................................................. </tspan><tspan fill="#79c0ff"> JavaScript</tspan></text>\n        <text x="543.0" y="550" class="text"><tspan fill="#e3b341">. SynapseIQ: </tspan><tspan fill="#484f58">................................................................. </tspan><tspan fill="#79c0ff"> Python</tspan></text>\n        <text x="543.0" y="610" class="text"><tspan fill="#c9d1d9">- Contact &amp; Links </tspan><tspan fill="#484f58">-------------------------------------------------------------------</tspan></text>\n        <text x="543.0" y="640" class="text"><tspan fill="#e3b341">. Email.Personal: </tspan><tspan fill="#484f58">........................................... </tspan><a href="mailto:shinucherian90@gmail.com" target="_blank"><tspan fill="#79c0ff">shinucherian90@gmail.com</tspan></a></text>\n        <text x="543.0" y="670" class="text"><tspan fill="#e3b341">. LinkedIn: </tspan><tspan fill="#484f58">........................................................... </tspan><a href="https://linkedin.com/in/shinucherian90" target="_blank"><tspan fill="#79c0ff">shinucherian90</tspan></a></text>\n        <text x="543.0" y="730" class="text"><tspan fill="#c9d1d9">- GitHub Stats </tspan><tspan fill="#484f58">----------------------------------------------------------------------</tspan></text>\n        <text x="543.0" y="760" class="text"><tspan fill="#e3b341">. Contributions: </tspan><tspan fill="#484f58">................... </tspan><tspan fill="#79c0ff">473 </tspan><tspan fill="#484f58">| </tspan><tspan fill="#e3b341">Stars: </tspan><tspan fill="#484f58">.................................. </tspan><tspan fill="#79c0ff">0</tspan></text>\n        <text x="543.0" y="790" class="text"><tspan fill="#e3b341">. Commits: </tspan><tspan fill="#484f58">......................... </tspan><tspan fill="#79c0ff">366 </tspan><tspan fill="#484f58">| </tspan><tspan fill="#e3b341">Followers: </tspan><tspan fill="#484f58">.............................. </tspan><tspan fill="#79c0ff">1</tspan></text>\n        <text x="543.0" y="82